<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="mole.png" type="image/png">
    <title>Whack-a-Mole - TikTok Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            padding: 16px;
        }

        .phone-container {
            position: relative;
            width: 100%;
            max-width: min(350px, calc((100svh - 32px) * 581 / 1035));
            container-type: inline-size;
        }

        .phone-background {
            width: 100%;
            height: auto;
            display: block;
        }

        .game-overlay {
            position: absolute;
            top: 6%;
            left: 4%;
            right: 4%;
            bottom: 6%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 20px;
        }

        h1 {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            z-index: 5;
        }

        /* Stats panel - nicer design */
        .stats {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            font-size: 10px;
            color: #fff;
            z-index: 5;
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(255,107,107,0.9) 0%, rgba(238,90,90,0.9) 100%);
            padding: 6px 10px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            text-align: center;
            min-width: 55px;
        }

        .stat-box .label {
            font-size: 8px;
            opacity: 0.9;
            display: block;
            margin-bottom: 2px;
        }

        .stat-box span {
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            display: block;
        }

        /* Game Over message */
        .game-over {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: bold;
            color: #ff6b6b;
            animation: bounce 1s infinite;
            display: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            white-space: nowrap;
            z-index: 10;
        }

        .game-over.show {
            display: block;
        }

        /* Winning message popup - fun design */
        .win-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(145deg, #ff6b6b 0%, #ee5a5a 50%, #ff8787 100%);
            color: #fff;
            padding: 20px 15px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            max-width: 88%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 2px 10px rgba(255,255,255,0.2);
            z-index: 100;
            animation: winPopupIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            line-height: 1.4;
            border: 3px solid rgba(255,255,255,0.3);
        }

        .win-message .face-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: block;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            animation: faceWiggle 0.5s ease-in-out;
        }

        @keyframes faceWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .win-message .win-title {
            font-size: 18px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .win-message .message-text {
            margin: 8px 0 15px;
            font-size: 11px;
            line-height: 1.5;
            opacity: 0.95;
        }

        .win-message .continue-btn {
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            color: #ee5a5a;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .win-message .continue-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 7px 20px rgba(0,0,0,0.4);
        }

        .win-message .continue-btn:active {
            transform: scale(0.95);
        }

        @keyframes winPopupIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }

        /* Start button overlay */
        .start-text {
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .start-text.hidden {
            display: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        /* Game board - 50% bigger */
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            margin-top: 10%;
        }

        /* Holes - 50% bigger */
        .hole {
            border: none;
            width: min(75px, 21cqw);
            height: min(75px, 21cqw);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: #111827;
            box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.8);
            transition: background 0.1s;
        }

        .hole.hit {
            background: #facc15;
        }

        .hole.missed {
            background: #f87171;
        }

        /* Mole - 50% bigger */
        .mole {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 87%;
            height: 87%;
            transform: translate(-50%, 100%);
            opacity: 0;
            transition: transform 0.2s ease-out, opacity 0.1s;
            pointer-events: none;
        }

        .mole.active {
            transform: translate(-50%, -50%);
            opacity: 1;
        }

        /* Instructions */
        .instructions {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.9);
            text-align: center;
        }

        .instructions p {
            font-size: 12px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
        }

        .instructions .sub {
            font-size: 10px;
            opacity: 0.8;
        }

        .instructions.hidden {
            display: none;
        }

        /* Red record button clickable area */
        .record-btn-area {
            position: absolute;
            top: 95.7%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24%;
            height: 16%;
            border: 0;
            background: transparent;
            cursor: pointer;
            z-index: 20;
            border-radius: 50%;
        }

        /* Hammer cursor */
        .hammer {
            position: fixed;
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%) rotate(0deg);
            transition: transform 0.08s ease-out;
            display: none;
        }

        .hammer.active {
            display: block;
        }

        .hammer.hitting {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .hammer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(3px 3px 5px rgba(0,0,0,0.5));
        }

        /* Score popup */
        .score-popup {
            position: absolute;
            color: #22c55e;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }

        @keyframes popUp {
            0% { transform: translate(-50%, 100%); }
            100% { transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <img src="tiktok.png" alt="Phone" class="phone-background">
        <div class="game-overlay">
            <h1>Whack-a-Mole!</h1>

            <div class="stats">
                <div class="stat-box">
                    <span class="label">SCORE</span>
                    <span id="score">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">TIME</span>
                    <span id="timer">60</span>
                </div>
                <div class="stat-box">
                    <span class="label">SPEED</span>
                    <span id="speed">0%</span>
                </div>
            </div>

            <div class="game-over" id="gameOver" role="status">🏆 Game Over! Score: <span id="finalScore">0</span></div>

            <div class="game-board" id="gameBoard">
                <!-- 9 holes will be generated by JS -->
            </div>

            <!-- Clickable area over the TikTok record button -->
            <button type="button" class="record-btn-area" id="recordBtn" aria-label="Start round">
                <span class="start-text" id="startText">START</span>
            </button>
        </div>
    </div>

    <!-- Hammer cursor -->
    <div class="hammer" id="hammer">
        <img src="hammer.png" alt="Hammer">
    </div>

    <script>
        // Game state
        let score = 0;
        let speed = 1000;
        let timeLeft = 60;
        let gameActive = false;
        let gameTimer = null;
        let moleTimer = null;
        let hideTimer = null;
        let lastHoleIndex = -1; // Track last hole to avoid repeats
        const holes = [];

        // Winning messages
        const winMessages = {
            10: "Ten hits! The moles are getting quicker.",
            15: "Fifteen hits! Keep an eye on the next hole.",
            20: "Twenty hits! See how many more you can catch."
        };

        // DOM elements
        const gameBoard = document.getElementById('gameBoard');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const speedEl = document.getElementById('speed');
        const recordBtn = document.getElementById('recordBtn');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const startTextEl = document.getElementById('startText');
        const hammer = document.getElementById('hammer');

        // Create the 9 holes (3x3 grid)
        function createHoles() {
            gameBoard.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('button');
                hole.type = 'button';
                hole.setAttribute('aria-label', 'Hole ' + (i + 1));
                hole.className = 'hole';
                hole.dataset.index = i;

                const mole = document.createElement('img');
                mole.src = 'mole.png';
                mole.className = 'mole';
                mole.alt = 'mole';
                mole.draggable = false;

                hole.appendChild(mole);
                gameBoard.appendChild(hole);
                holes.push({ element: hole, mole: mole, hasMole: false });

                hole.addEventListener('click', () => whackMole(i));
            }
        }

        // Update speed display
        function updateSpeedDisplay() {
            const speedPercent = Math.round((1000 - speed) / 7);
            speedEl.textContent = speedPercent + '%';
        }

        // Pause game for winning message
        let gamePaused = false;

        function pauseGame() {
            gamePaused = true;
            clearInterval(gameTimer);
            clearTimeout(moleTimer);
            clearTimeout(hideTimer);
            // Hide all active moles
            holes.forEach(h => {
                h.mole.classList.remove('active');
                h.hasMole = false;
            });
        }

        function resumeGame() {
            gamePaused = false;
            // Restart timer
            gameTimer = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
            // Restart mole spawning
            spawnMole();
        }

        // Show winning message
        function showWinMessage(message) {
            pauseGame();

            const gameOverlay = document.querySelector('.game-overlay');
            const winDiv = document.createElement('div');
            winDiv.className = 'win-message';
            winDiv.innerHTML = `
                <img src="mole.png" alt="Winner" class="face-img">
                <div class="win-title">🎉 CONGRATULATIONS! 🎉</div>
                <div class="message-text">${message}</div>
                <button class="continue-btn">Continue! 🔨</button>
            `;
            gameOverlay.appendChild(winDiv);

            // Continue button handler
            const continueBtn = winDiv.querySelector('.continue-btn');
            continueBtn.addEventListener('click', () => {
                winDiv.remove();
                if (gameActive && timeLeft > 0) {
                    resumeGame();
                }
            });
        }

        // Check for winning milestones
        function checkWinMilestone(newScore) {
            if (winMessages[newScore]) {
                showWinMessage(winMessages[newScore]);
            }
        }

        // Whack a mole
        function whackMole(index) {
            if (!gameActive || gamePaused) return;

            const holeData = holes[index];
            if (holeData.hasMole) {
                // Hit!
                score++;
                scoreEl.textContent = score;

                // Check for winning milestone
                checkWinMilestone(score);

                // Visual feedback
                holeData.element.classList.add('hit');
                setTimeout(() => holeData.element.classList.remove('hit'), 200);

                // Hide the mole
                holeData.mole.classList.remove('active');
                holeData.hasMole = false;

                // Show score popup
                showScorePopup(holeData.element);

                // Speed up
                speed = Math.max(300, speed - 20);
                updateSpeedDisplay();

                // Play sound
                playSound('hit');
            }
        }

        // Show floating +1
        function showScorePopup(holeElement) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = '+1';
            popup.style.left = '50%';
            popup.style.top = '30%';
            popup.style.transform = 'translateX(-50%)';
            holeElement.appendChild(popup);
            setTimeout(() => popup.remove(), 600);
        }

        // Spawn a mole
        function spawnMole() {
            if (!gameActive || gamePaused) return;

            // Find empty holes, excluding the last hole used
            const emptyHoles = holes.filter((h, idx) => !h.hasMole && idx !== lastHoleIndex);

            // If all holes except last are occupied, allow last hole
            const availableHoles = emptyHoles.length > 0 ? emptyHoles : holes.filter(h => !h.hasMole);
            if (availableHoles.length === 0) return;

            // Pick a random available hole
            const randomHole = availableHoles[Math.floor(Math.random() * availableHoles.length)];
            const index = holes.indexOf(randomHole);

            // Remember this hole to avoid next time
            lastHoleIndex = index;

            randomHole.hasMole = true;
            randomHole.mole.classList.add('active');

            // Auto-hide after a while
            hideTimer = setTimeout(() => {
                if (randomHole.hasMole) {
                    // Missed!
                    randomHole.element.classList.add('missed');
                    setTimeout(() => randomHole.element.classList.remove('missed'), 200);
                    randomHole.mole.classList.remove('active');
                    randomHole.hasMole = false;
                }
            }, speed * 0.8);

            // Schedule next mole
            moleTimer = setTimeout(spawnMole, speed);
        }

        // Start game
        function startGame() {
            if (gameActive) return; // Prevent double-start

            score = 0;
            speed = 1000;
            timeLeft = 60;
            gameActive = true;
            gamePaused = false;
            lastHoleIndex = -1; // Reset last hole tracking

            scoreEl.textContent = score;
            timerEl.textContent = timeLeft;
            updateSpeedDisplay();

            recordBtn.disabled = true;
            startTextEl.classList.add('hidden');
            gameOverEl.classList.remove('show');

            // Reset all holes
            holes.forEach(h => {
                h.hasMole = false;
                h.mole.classList.remove('active');
            });

            // Start timer
            gameTimer = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Start spawning moles
            spawnMole();

            // Resume audio context (for iOS)
            try {
                const Audio = window.AudioContext || window.webkitAudioContext;
                if (Audio && !audioContext) audioContext = new Audio();
                if (audioContext?.state === 'suspended') audioContext.resume().catch(() => {});
            } catch {
                // The round is playable on devices without audio.
            }
        }

        // End game
        function endGame() {
            gameActive = false;
            clearInterval(gameTimer);
            clearTimeout(moleTimer);
            clearTimeout(hideTimer);

            // Hide all moles
            holes.forEach(h => {
                h.hasMole = false;
                h.mole.classList.remove('active');
            });

            finalScoreEl.textContent = score;
            gameOverEl.classList.add('show');

            // Show AGAIN text on button
            recordBtn.disabled = false;
            recordBtn.setAttribute('aria-label', 'Play again');
            startTextEl.textContent = 'AGAIN';
            startTextEl.classList.remove('hidden');
        }

        // Sound effects
        let audioContext = null;

        function playSound(type) {
            if (audioContext?.state !== "running") return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (type === 'hit') {
                oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(300, audioContext.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            }
        }

        // Hammer follows cursor/finger
        function updateHammerPosition(x, y) {
            hammer.style.left = x + 'px';
            hammer.style.top = y + 'px';
        }

        document.addEventListener('mousemove', (e) => {
            hammer.classList.add('active');
            updateHammerPosition(e.clientX, e.clientY);
        });

        document.addEventListener('mousedown', () => {
            hammer.classList.add('hitting');
        });

        document.addEventListener('mouseup', () => {
            hammer.classList.remove('hitting');
        });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            hammer.classList.add('active');
            const touch = e.touches[0];
            updateHammerPosition(touch.clientX, touch.clientY);
        }, { passive: false });

        document.addEventListener('touchstart', (e) => {
            hammer.classList.add('active');
            const touch = e.touches[0];
            updateHammerPosition(touch.clientX, touch.clientY);
            hammer.classList.add('hitting');
        });

        document.addEventListener('touchend', () => {
            hammer.classList.remove('hitting');
        });

        // Event listeners - Record button starts/restarts game
        recordBtn.addEventListener('click', startGame);


        // Initialize
        createHoles();
    </script>
</body>
</html>
